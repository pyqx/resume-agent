[project]
name = "resume-agent"
version = "0.1.0"
description = "AI-powered resume assistant agent with deep reasoning"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Resume Agent Team" }]
readme = "README.md"

dependencies = [
    "langgraph>=0.2.0",
    "anthropic>=0.30.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.27.0",
    "chromadb>=0.5.0",
    "diskcache>=5.6",
    "aiosqlite>=0.20.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "sse-starlette>=1.8.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "deepdiff>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "core*", "api*", "prompts*", "tests*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
