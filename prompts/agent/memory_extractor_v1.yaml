# Memory Extraction Prompt v1
version: "1.0"

description: "Extract structured facts from conversation turns"

extraction_rules:
  user_profile:
    - "Concrete facts about the user: skills, education, work history, job target"
    - "Only extract what the user has explicitly stated"
  preference:
    - "User's expressed preferences: style, format, industry, approach"
    - "Capture both explicit ('I prefer X') and implicit (repeatedly choosing X)"
  session:
    - "Temporary context for current conversation"
    - "Current resume being edited, recent JD, active strategic plan step"
  feedback:
    - "User's reactions to suggestions: accepted, rejected, modified"
    - "Patterns in what the user likes/dislikes"

confidence_guidelines:
  1.0: "User explicitly stated this fact"
  0.8: "Strongly implied by user's statements"
  0.5: "Inferred from context, needs verification"
  0.3: "Tentative observation, likely needs confirmation"
